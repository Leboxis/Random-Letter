name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: xcodebuild -project RandomLetter.xcodeproj -scheme RandomLetter -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/RandomLetter.app" Payload/
          zip -r RandomLetter.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RandomLetter-ipa
          path: RandomLetter.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)
          TAG="v$VERSION"
          TITLE="Random Letter $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" RandomLetter.ipa --clobber
          else
            gh release create "$TAG" RandomLetter.ipa --title "$TITLE" --generate-notes
          fi
